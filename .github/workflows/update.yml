name: update-prices

on:
  schedule:
    # каждый час 09:15–18:15 по Таллину (06–15 UTC летом), пн–пт
    - cron: "15 6-15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install yfinance pillow
          sudo apt-get install -y -qq fonts-dejavu-core

      - name: Update prices
        run: python scripts/update_prices.py

      - name: Render e-ink screen
        run: python eink/render.py

      - name: Commit & push
        run: |
          git config user.name "wall-bot"
          git config user.email "wall-bot@users.noreply.github.com"
          git add data/prices.json data/history.json data/benchmark.json eink/out/
          git diff --cached --quiet || git commit -m "prices $(date -u +'%Y-%m-%d %H:%M')"
          # Rebase on top of any commits pushed while this run was working
          git pull --rebase origin main
          git push
